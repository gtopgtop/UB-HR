{# Verify a requirement's proof or a 201-file upload (plan §3 Modules 1 and 3). verify.js fills it from the Verify button's data-verify-* attributes. #}
<dialog class="ds-modal m-md" id="verify-dialog" aria-labelledby="verify-title" aria-describedby="verify-desc">
  <form method="dialog" novalidate class="fms-dialog-form" data-verify-form>
    <div class="ds-modal-body">
      <div class="ds-modal-head">
        <div class="ds-modal-icon" aria-hidden="true"><i class="ti ti-file-check"></i></div>
        <h2 class="ds-modal-title" id="verify-title">Verify the proof</h2>
        <p class="ds-modal-desc" id="verify-desc"><span data-verify-for></span>. <span data-verify-done></span> The employee is notified either way.</p>
      </div>
      <div class="fms-proof" aria-hidden="true"><i class="ti ti-file-text"></i><span data-verify-file></span></div>
      <div class="ds-field">
        <span class="ds-label" id="verify-outcome-label">Outcome</span>
        <div class="ds-segmented" role="group" aria-labelledby="verify-outcome-label">
          <button type="button" class="ds-seg" aria-pressed="true" data-verify-outcome="accept"><i class="ti ti-check" aria-hidden="true"></i>Accept</button>
          <button type="button" class="ds-seg" aria-pressed="false" data-verify-outcome="return"><i class="ti ti-arrow-back-up" aria-hidden="true"></i>Send back</button>
        </div>
      </div>
      <div class="ds-field">
        <label class="ds-label" for="verify-remark">Remark <span class="fms-caption">(needed when sending back)</span></label>
        <textarea class="ds-control" id="verify-remark" rows="2" aria-describedby="verify-error" data-verify-remark></textarea>
        <p class="ds-error fms-field-error" id="verify-error" data-verify-error hidden><i class="ti ti-alert-circle" aria-hidden="true"></i><span>Say what is missing so the employee can resubmit.</span></p>
      </div>
    </div>
    <div class="ds-modal-foot">
      <div class="ds-modal-foot-row">
        <button type="button" class="ds-btn ds-btn-secondary" data-dialog-close autofocus>Cancel</button>
        <button type="submit" class="ds-btn ds-btn-primary">Save</button>
      </div>
    </div>
  </form>
</dialog>
