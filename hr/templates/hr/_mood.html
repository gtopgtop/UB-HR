<div class="moods {{ extra_class }}" role="radiogroup" aria-label="How are you feeling today?">
  <label class="mood"><input type="radio" name="mood" value="low"><span>Low</span></label>
  <label class="mood"><input type="radio" name="mood" value="meh"><span>Meh</span></label>
  <label class="mood"><input type="radio" name="mood" value="okay"><span>Okay</span></label>
  <label class="mood"><input type="radio" name="mood" value="good" checked><span>Good</span></label>
  <label class="mood"><input type="radio" name="mood" value="great"><span>Great</span></label>
</div>
